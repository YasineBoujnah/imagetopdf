<div class="converter-wrapper">
  <div class="header">
    <h1>Image to PDF Converter</h1>
    <p>Fast, easy, and completely running in your browser.</p>
  </div>

  <div class="upload-card">
    <button type="button" class="upload-zone" (click)="fileInput.click()">
      <div class="upload-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
        </svg>
      </div>
      <div class="upload-text">
        <span class="highlight">Click to upload</span> or drag and drop
      </div>
      <div class="upload-subtext">Supports JPG, PNG, WEBP</div>
    </button>
    <input
      #fileInput
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
      (change)="onFileSelected($event)"
    />
  </div>

  <div class="preview-card" *ngIf="images.length > 0">
    <div class="preview-header">
      <h2>{{ images.length }} Image{{ images.length > 1 ? 's' : '' }} Selected</h2>
    </div>
    
    <div class="preview-grid">
      <div class="preview-item" *ngFor="let img of images; let i = index">
        <div class="image-wrapper">
          <img [src]="img.url" alt="Preview {{ i + 1 }}" />
          <button class="remove-btn" (click)="removeImage(i)" title="Remove Image">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="action-section">
      <button class="convert-btn" (click)="generatePdf()">
        Generate PDF 
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12l-3-3m0 0l-3 3m3-3v6m-1.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
        </svg>
      </button>
    </div>
  </div>
</div>
